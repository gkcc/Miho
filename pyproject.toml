[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsr-endgame-exporter"
version = "0.1.0"
description = "Local exporter for Honkai: Star Rail endgame usage data from MocStats and Prydwen."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
excel = ["pandas==2.2.3", "openpyxl==3.1.5"]
test = ["pytest", "Pillow"]

[tool.setuptools.packages.find]
include = ["hsr_endgame_exporter*", "zzz_endgame_exporter*", "miho_core*"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
  "live: mutable product-path probes that are excluded from the deterministic default suite",
]
