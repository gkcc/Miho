[package]
name = "miho-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "miho_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
miho-app = { path = "../../miho-app" }
miho-core = { path = "../../miho-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-dialog = "=2.7.1"
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[dev-dependencies]
anyhow.workspace = true
